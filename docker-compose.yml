services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: relay-api
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_ID=node-1
      - FRONTEND_URLS=http://localhost:5173
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
