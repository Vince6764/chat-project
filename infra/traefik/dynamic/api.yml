http:
  routers:
    api:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: api
      middlewares:
        - api-retry

  middlewares:
    api-retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # Example rateLimit middleware (disabled so load testing is not throttled at the edge):
    # api-ratelimit:
    #   rateLimit:
    #     average: 100
    #     burst: 50

  services:
    api:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /health/ready
          interval: 5s
          timeout: 3s
        servers:
          - url: http://api-1:3000
          - url: http://api-2:3000
